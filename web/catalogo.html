<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <script>try{document.documentElement.dataset.fotos=localStorage.getItem("essenze-fotos")||"blanco"}catch(e){document.documentElement.dataset.fotos="blanco"}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Catálogo · Essenze Parfum &amp; Decants</title>
  <meta name="description" content="Catálogo de perfumes árabes, de diseñador y de nicho. Filtrá por marca, género, acorde y estación.">
  <meta name="theme-color" content="#0b0a09">
  <meta property="og:image" content="/img/compartir.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/img/favicon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Essenze">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Tenor+Sans&display=swap">
  <link rel="stylesheet" href="/css/estilos.css">
  <script type="module" src="/js/catalogo.js"></script>
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <header class="cabecera" data-cabecera></header>

  <main id="contenido" class="catalogo">
    <div class="contenedor">
      <div class="catalogo__cabecera">
        <h1 class="titulo-pagina" data-titulo>Catálogo</h1>
        <p class="catalogo__cuenta" data-cuenta aria-live="polite"></p>
      </div>

      <ul class="pestanas" data-tabs aria-label="Tipo de perfume"></ul>

      <div class="herramientas">
        <form class="buscador" role="search">
          <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg>
          <input type="search" data-buscar placeholder="Buscar perfume, marca o nota" aria-label="Buscar en el catálogo" autocomplete="off">
        </form>
        <label class="ordenar">
          <span>Ordenar</span>
          <select data-orden aria-label="Ordenar por"></select>
        </label>
        <button class="boton boton--contorno boton--chico herramientas__filtros" type="button" data-abrir-filtros>
          <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
          Filtros <span data-n></span>
        </button>
      </div>

      <div class="chips" data-chips hidden></div>

      <div class="catalogo__cuerpo">
        <aside class="lateral" data-lateral aria-label="Filtros">
          <div class="filtros" data-filtros></div>
        </aside>
        <div class="catalogo__resultados">
          <div class="grilla-productos grilla-productos--catalogo" data-grilla></div>
          <div class="mas-resultados" data-mas-resultados hidden><button class="boton boton--contorno" type="button">Ver más perfumes</button></div>
          <div class="vacio" data-vacio hidden>
            <img class="personaje-foto vacio__personaje" src="/img/cocodrilo-frasco.webp" alt="" width="640" height="640" loading="lazy" decoding="async" draggable="false">
            <p class="vacio__titulo">No hay perfumes con esos filtros</p>
            <p>Probá quitar alguno, o escribinos por WhatsApp y te ayudamos a encontrar lo que buscás.</p>
            <button class="boton boton--contorno" type="button" data-limpiar-vacio>Ver todo el catálogo</button>
          </div>
        </div>
      </div>
    </div>

    <dialog class="hoja" data-hoja aria-label="Filtros">
      <div class="hoja__panel">
        <header class="hoja__cabecera">
          <h2 class="bolsa__titulo">Filtros</h2>
          <button class="boton-icono" type="button" data-cerrar-hoja aria-label="Cerrar filtros"><svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </header>
        <div class="hoja__cuerpo" data-hoja-cuerpo></div>
        <footer class="hoja__pie">
          <button class="boton boton--lleno boton--ancho" type="button" data-cerrar-hoja>Ver <span data-cuenta></span></button>
        </footer>
      </div>
    </dialog>
  </main>

  <footer class="pie" data-pie></footer>
</body>
</html>
